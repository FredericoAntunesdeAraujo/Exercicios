<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    

    <form id="formCadastro">

        <label for="nomePratoC">Nome</label>
        <br>
        <input type="text" name="" id="nomePratoC" placeholder="Nome do Prato">
        <br><br>

        <label for="descricaoPratoC">Descricao</label>
        <br>
        <textarea name="" id="descricaoPratoC"></textarea>
        <br><br>

        <label for="precoPratoC">Preço</label>
        <br>
        <input type="number" name="" id="precoPratoC" step="0.01">
        <br><br>

        <label for="categoriaPratoC">Categoria</label>
        <br>
        <select name="" id="categoriaPratoC">
            <option value="">Selecione uma categoria. . .</option>
        </select>
        <br><br>

        <button type="submit">Enviar</button>
    </form>






    <script src="js/cadastro.js"></script>
</body>
</html>
